# VLM Event Monitor — application configuration

# HTTP server (cpp-httplib)
server:
    host: "0.0.0.0"
    port: 80

# HailoRT device used by the VLM Inference Manager
hailort_device:
    device_id: "device0"

# Path to the YAML file that holds the persisted event list AND the active
# event-check mode (performance | accuracy). The frontend's Save button
# rewrites this file; Load re-reads it. If the file is missing at startup
# the app boots with an empty event list + Performance mode and logs a
# warning — Save from the UI creates the file on first use.
events_file: "/home/root/apps/vlm_event_monitor/resources/configs/vlm_event_mon\
    itor_events.yaml"

# VLM model configuration
vlm_model:
    hef_path: "/home/root/apps/vlm_event_monitor/resources/Qwen2-VL-2B-Instruct.hef"
    default_max_generated_tokens: 256
    busy_wait_timeout_ms: 5000 # Timeout of requesting vlm inferencing while its busy

# Event-check loop configuration
# The medialib profile currently outputs the VlmInput (336x336) and VGA
# streams at 1 FPS, so the window size is implied by the mode (Performance
# = 5 s / 3 frames, Accuracy = 10 s / 4 frames).
# The active mode (performance | accuracy) is NOT defined here — it lives
# in vlm_event_monitor_events.yaml (see events_file above).
# The blocks below only define mode-specific tuning (lead_prompt, max_tokens).
#
#   performance — sample 3 frames in 5 s (frames 1, 3, 5),
#                 ONE aggregated VLM inference per cycle that asks
#                 about all enabled events at once. Lower latency at the cost of
#                 lower accuracy.
#   accuracy    — sample 4 frames in 10 s (frames 2, 4, 6, 8). One
#                 "describe-this-sequence" inference runs first, then
#                 ONE inference per enabled event with prompt
#                 "<event>? just answer with Yes or No". Higher
#                 latency but cleaner per-event isolation.
event_check:
    # Performance-mode tunables.
    performance:
        # Front of the (single) user prompt sent to the VLM. At runtime the
        # app appends the numbered event list "1.[event1] 2.[event2] …" to
        # the end of this string. Each event uses the runner's
        # max_generated_tokens_per_event budget.
        lead_prompt:
            "Base on the main action from given video/images, answer YES or NO
            for each activity as follow:"

    # Accuracy-mode tunables.
    accuracy:
        # Description inference run first per cycle. The model's response
        # is printed but not parsed. Per-event yes/no follow-ups are
        # text-only on the same VLM session.
        # NOTE: Should keep the max token within 30 otherwise it will take too
        #       long and break the continuity cycle
        lead_prompt: "Describe the main action in this video in one sentence"
        max_tokens: 25

    # Debug-only override. When `enabled: true`, the runner sends `prompt`
    # verbatim to the VLM with `max_generated_tokens` tokens for each
    # batch — bypassing both modes (no event list, no yes/no parser).
    # Output is printed raw alongside the same VLM stats banner used for
    # normal cycles. Leave `enabled: false` for production.
    debug_prompt_override:
        enabled: false
        prompt: "describe the video sequence activity in 1 sentence"
        max_generated_tokens: 25

    # Debug-only metadata for cross-verifying VLM output against a native
    # network. When `enabled: true`, the runner does TWO things
    # on every event-check cycle:
    #
    #   1. Writes a per-cycle directory to disk:
    #        /var/volatile/vlm-event-metadata/<timestamp>-<seq>/
    #          frame_0.jpg ... frame_N.jpg   (336x336 RGB JPEGs)
    #          metadata.json                 (mode, prompts, responses,
    #                                          stats, vlm_config snapshot)
    #      `keep_last` below caps the number of directories on disk.
    #
    #   2. Inlines the same bundle inside the SSE `new_event` payload
    #      under an optional `debug` node, so the frontend's per-event
    #      3-dot "Download debug bundle" button has data to package into
    #      a zip client-side. NOTE: `keep_last` does NOT apply to this
    #      path — every event the frontend receives while the toggle is
    #      on carries its own bundle (no retention concept on the wire).
    #
    # When false (default), neither path is active and the frontend's
    # 3-dot button is hidden.
    #
    # WARNING: /var/volatile is tmpfs (RAM-backed). Each cycle adds files
    # to memory. To keep RAM bounded the runner auto-evicts oldest dirs
    # so only the most recent `keep_last` cycles survive (default 10).
    # Even so, this is for SHORT debug runs ONLY — NOT safe for production
    # or long-running deployments. Disable (false) or run
    # `rm -rf /var/volatile/vlm-event-metadata` between runs.
    debug_metadata_save:
        enabled: true
        keep_last: 10 # on-disk retention only; does not affect SSE inline

    # When an event fires, that specific event_id is suppressed for
    # `cooldown_seconds` before it can fire again. Per-event: other
    # events are unaffected and can still fire while this one is in
    # cooldown.
    cooldown_seconds: 60

# Chat behaviour
chat:
    # Idle timeout (seconds). The broker's janitor closes any chat session
    # whose last /chat/stream activity is older than this. On expiry the
    # frontend is notified via the chat_session_expired SSE event so the
    # modal can render an inactivity banner. Event-check resumes regardless
    # of whether the user still has the modal open.
    session_timeout_seconds: 300

    # Per-stream override default for max_generated_tokens. Frontend can
    # override per request via the body field of the same name.
    default_max_generated_tokens: 100
