                            this._lockForFullContext();
                        }
                        // Insert immediately after the matching assistant
                        // bubble so we can keep streaming a follow-up reply.
                        if (this.currentAssistantBubble &&
                            this.currentAssistantBubble.parentNode === this.transcriptEl) {
                            this.transcriptEl.insertBefore(statsLine,
                                this.currentAssistantBubble.nextSibling);
                        } else {
                            this.transcriptEl.appendChild(statsLine);
                        }
                        this.transcriptEl.scrollTop = this.transcriptEl.scrollHeight;
                    }
                }
            }
        }

        // ─────────────── WebRTC client (preserved from Stage 1) ───────────────
        //
        // Talks to:
        //   POST /api/webrtc/offer          → returns { type, sdp }
        //   POST /api/webrtc/answer         → body { type, sdp }
        //   POST /api/webrtc/ice-candidate  → body { candidate, sdpMid, sdpMLineIndex }
        //   GET  /api/webrtc/status         → { connected: bool }

        class WebRTCClient {
            constructor() {
                this.peerConnection = null;
                this.videoEl = $('videoStream');
                this.controlsEl = $('videoControls');
                this.playBtn = $('playButton');
                this.statusEl = $('videoStatus');
                this.overlayTextEl = $('videoOverlayText');
                this.isPlaying = false;

                this.RECONNECT_INTERVAL_MS = 2000;
                this.MAX_RECONNECT_ATTEMPTS = 15;
                this.reconnectTimer = null;
                this.reconnectAttempts = 0;

                this.bindEvents();
                this.startStatusPolling();
            }

            bindEvents() {
                this.playBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.start();
                });
                this.videoEl.addEventListener('click', () => {
                    if (this.isPlaying) this.stop();
                });
            }

            setStatus(state) {
                this.statusEl.className = `video-status status-${state}`;
                this.statusEl.textContent = state[0].toUpperCase() + state.slice(1);
            }

            showControls(show) {
                if (show) {
                    this.controlsEl.classList.remove('hidden');
                    this.overlayTextEl.style.display = '';
                } else {
                    this.controlsEl.classList.add('hidden');
                    this.overlayTextEl.style.display = 'none';
                }
            }

            log(msg) { console.log('[webrtc]', msg); }

            async start() {
                try {
                    this.setStatus('connecting');
                    this.log('starting');

                    this.peerConnection = new RTCPeerConnection({ iceServers: [] });

                    this.peerConnection.onicecandidate = (event) => {
                        if (event.candidate) this.sendIceCandidate(event.candidate);
                    };

                    this.peerConnection.ontrack = (event) => {
                        this.log('remote track received');
                        this.videoEl.srcObject = event.streams[0];
                        this.videoEl.style.display = 'block';
                        this.showControls(false);
                        this.isPlaying = true;
                        this.videoEl.play().catch(err => this.log('play() failed: ' + err.message));
                        this.setStatus('connected');
                        this.stopReconnectAttempts();
                    };

                    this.peerConnection.onconnectionstatechange = () => {
                        const s = this.peerConnection.connectionState;
                        this.log('pc state: ' + s);
                        if (s === 'connected') {
                            this.setStatus('connected');
                        } else if (s === 'disconnected' || s === 'failed' || s === 'closed') {
                            this.handleConnectionLost();
                        }
                    };

                    const offerResp = await fetch('/api/webrtc/offer', { method: 'POST' });
                    if (!offerResp.ok) throw new Error('offer HTTP ' + offerResp.status);
                    const offer = await offerResp.json();
                    await this.peerConnection.setRemoteDescription({ type: 'offer', sdp: offer.sdp });

                    const answer = await this.peerConnection.createAnswer();
                    await this.peerConnection.setLocalDescription(answer);

                    await fetch('/api/webrtc/answer', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ type: 'answer', sdp: answer.sdp })
                    });
                    this.log('answer sent');
                } catch (err) {
                    this.log('start failed: ' + err.message);
                    this.setStatus('disconnected');
                    this.videoEl.style.display = 'none';
                    this.showControls(true);
                    this.isPlaying = false;
                    throw err;
                }
            }

            async sendIceCandidate(candidate) {
                try {
                    await fetch('/api/webrtc/ice-candidate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            candidate: candidate.candidate,
                            sdpMid: candidate.sdpMid,
                            sdpMLineIndex: candidate.sdpMLineIndex
                        })
                    });
                } catch (err) {
                    this.log('ice send failed: ' + err.message);
                }
            }

            stop() {
                this.stopReconnectAttempts();
                if (this.peerConnection) {
                    this.peerConnection.close();
                    this.peerConnection = null;
                }
                this.videoEl.srcObject = null;
                this.videoEl.style.display = 'none';
                this.showControls(true);
                this.setStatus('disconnected');
                this.isPlaying = false;
                this.log('stopped by user');
            }

            handleConnectionLost() {
                if (!this.isPlaying) return;
                this.log('connection lost; will attempt reconnect');
                this.videoEl.srcObject = null;
                this.videoEl.style.display = 'none';
                this.showControls(true);
                this.setStatus('disconnected');
                this.isPlaying = false;
                if (this.peerConnection) {
                    this.peerConnection.close();
                    this.peerConnection = null;
                }
                this.startReconnectAttempts();
            }

            startReconnectAttempts() {
                if (this.reconnectTimer) return;
                this.reconnectAttempts = 0;
                this.reconnectTimer = setInterval(async () => {
                    this.reconnectAttempts += 1;
                    if (this.reconnectAttempts > this.MAX_RECONNECT_ATTEMPTS) {
                        this.log('max reconnect attempts reached');
                        this.stopReconnectAttempts();
                        return;
                    }
                    this.log(`reconnect attempt ${this.reconnectAttempts}`);
                    try {
                        await this.start();
                    } catch (e) {
                        // keep trying
                    }
                }, this.RECONNECT_INTERVAL_MS);
            }

            stopReconnectAttempts() {
                if (this.reconnectTimer) {
                    clearInterval(this.reconnectTimer);
                    this.reconnectTimer = null;
                }
                this.reconnectAttempts = 0;
            }

            startStatusPolling() {
                setInterval(async () => {
                    try {
                        const r = await fetch('/api/webrtc/status');
                        if (!r.ok) return;
                        const s = await r.json();
                        if (this.isPlaying && s.connected === false &&
                            this.peerConnection && this.peerConnection.connectionState === 'connected') {
                            this.log('server reports disconnected; reconnecting');
                            this.handleConnectionLost();
                        }
                    } catch (_) { /* silent */ }
                }, 2000);
            }
        }

        // ─────────────── Stage 6 item 1 — VLM / Monitoring status binding ───────────────
        //
        // Renders two header badges + toggles the disabled class on
        // VLM-dependent controls. Driven by three inputs that flow into
        // module-level state and a single render function:
        //
        //   1. SSE monitoring_status events (live updates)
        //   2. One-shot fetch /api/monitoring/status on page load
        //   3. Backend-disconnect signal (SSE onerror OR no heartbeat in 40 s)
        //
        // The backend never sends a "disconnected" state — it's a synthetic
        // frontend flag derived from the existing 15 s SSE heartbeat.

        let g_lastStatusPayload = null;
        let g_backendDisconnected = false;
        let g_lastSseRxAt = Date.now();
        const SSE_STALE_AFTER_MS = 40_000;   // ~2.5x the backend's 15 s heartbeat

        function renderStatusBadges() {
            const vlmBadge = $('vlmStatusBadge');
            const monBadge = $('monitoringStatusBadge');

            // ── Backend-disconnect override (no per-payload data needed) ──
            if (g_backendDisconnected) {
                if (vlmBadge) {
                    vlmBadge.classList.remove(
                        'state-loading', 'state-ready', 'state-failed', 'loading-pulse');
                    vlmBadge.classList.add('state-disconnected');
                    vlmBadge.querySelector('.status-text').textContent = 'Backend disconnected';
                    vlmBadge.title = 'Backend disconnected — retrying…';
                }
                if (monBadge) {
                    monBadge.classList.remove(
                        'state-running', 'state-stopped', 'state-paused', 'loading-pulse');
                    monBadge.classList.add('state-disconnected');
                    monBadge.querySelector('.status-text').textContent = 'Backend disconnected';
                    monBadge.title = 'Backend disconnected — retrying…';
                }
                document.querySelectorAll('.vlm-dependent').forEach(el => {
                    if (!el.classList.contains('vlm-not-ready') && !el.dataset.titleReady && el.title) {
                        el.dataset.titleReady = el.title;
                    }
                    el.classList.add('vlm-not-ready');
                    el.title = 'Backend disconnected';
                });
                return;
            }

            // ── Normal (live) rendering, driven by the most recent payload ──
            const payload = g_lastStatusPayload || {};
            const vlmState = payload.vlm_state || 'loading';
            const vlmError = payload.vlm_error || '';
            const monitorState = payload.state || 'stopped';
            const pauseReason = payload.monitoring_pause_reason || '';

            // ── VLM badge ──
            if (vlmBadge) {
                vlmBadge.classList.remove(
                    'state-loading', 'state-ready', 'state-failed', 'state-disconnected');
                let vlmLabel = 'VLM loading…';
                if (vlmState === 'ready') {
                    vlmBadge.classList.add('state-ready');
                    vlmLabel = 'VLM ready';
                } else if (vlmState === 'failed') {
                    vlmBadge.classList.add('state-failed');
                    vlmLabel = 'VLM failed' + (vlmError ? ': ' + vlmError : '');
                } else {
                    vlmBadge.classList.add('state-loading');
                }
                vlmBadge.querySelector('.status-text').textContent = vlmLabel;
                vlmBadge.title = vlmLabel;
            }

            // ── Monitoring badge — derived from (state, vlm_state, pause_reason) ──
            if (monBadge) {
                monBadge.classList.remove(
                    'state-running', 'state-stopped', 'state-paused', 'state-disconnected');
                let monClass = 'state-stopped';
                let monLabel = 'Monitoring stopped';
                if (vlmState === 'loading') {
                    monClass = 'state-stopped';
                    monLabel = monitorState === 'running'
                        ? 'Monitoring waiting — VLM loading'
                        : 'Monitoring stopped — VLM loading';
                } else if (vlmState === 'failed') {
                    monClass = 'state-stopped';
                    monLabel = monitorState === 'running'
                        ? 'Monitoring unavailable — VLM failed'
                        : 'Monitoring stopped — VLM failed';
                } else if (pauseReason === 'chat_active') {
                    monClass = 'state-paused';
                    monLabel = 'Monitoring paused — chat active';
                } else if (monitorState === 'running') {
                    monClass = 'state-running';
                    monLabel = 'Monitoring running';
                } else {
                    monClass = 'state-stopped';
                    monLabel = 'Monitoring stopped';
                }
                monBadge.classList.add(monClass);
                monBadge.querySelector('.status-text').textContent = monLabel;
                monBadge.title = monLabel;
            }

            // ── Pulse the dot on both badges while VLM is loading ──
            const isLoading = vlmState === 'loading';
            [vlmBadge, monBadge].forEach(b => {
                if (b) b.classList.toggle('loading-pulse', isLoading);
            });

            // ── VLM-dependent controls (Chat Now, future controls) ──
            const vlmReady = vlmState === 'ready';
            document.querySelectorAll('.vlm-dependent').forEach(el => {
                if (vlmReady) {
                    el.classList.remove('vlm-not-ready');
                    const readyTitle = el.dataset.titleReady;
                    if (readyTitle) el.title = readyTitle;
                } else {
                    if (!el.classList.contains('vlm-not-ready')) {
                        if (!el.dataset.titleReady && el.title) {
                            el.dataset.titleReady = el.title;
                        }
                    }
                    el.classList.add('vlm-not-ready');
                    el.title = vlmState === 'failed'
                        ? ('VLM failed' + (vlmError ? ': ' + vlmError : ''))
                        : 'VLM is still loading…';
                }
            });

            // ── Settings-modal cooldown slider — sync from live state ──
            // Reflects the current EventStateTracker value so the slider
            // picks up changes made in another tab (or the YAML default
            // once VLM finishes loading). Skipped while the user is
            // actively dragging this tab's slider so we don't yank the
            // thumb out from under them.
            const slider = document.getElementById('cooldownSlider');
            const valueEl = document.getElementById('cooldownValue');
            if (slider && valueEl && typeof payload.cooldown_seconds === 'number') {
                if (slider.dataset.dragging !== 'true') {
                    slider.value = String(payload.cooldown_seconds);
                    valueEl.textContent = payload.cooldown_seconds + ' s';
                }
            }
        }

        // Compatibility wrapper — older sites call applyMonitoringStatus(payload)
        // directly. Stores the payload and re-renders.
        function applyMonitoringStatus(payload) {
            if (!payload) return;
            g_lastStatusPayload = payload;
            renderStatusBadges();
        }

        // Called on every SSE event arrival to mark the backend as alive.
        // Clears the disconnected flag if it was set, and re-renders to
        // restore the live state.
        function noteSseRx() {
            g_lastSseRxAt = Date.now();
            if (g_backendDisconnected) {
                g_backendDisconnected = false;
                renderStatusBadges();
            }
        }

        function setBackendDisconnected() {
            if (g_backendDisconnected) return;
            g_backendDisconnected = true;
            renderStatusBadges();
        }

        function fetchInitialMonitoringStatus() {
            fetch('/api/monitoring/status')
                .then(r => r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)))
                .then(applyMonitoringStatus)
                .catch(() => {
                    // Backend not reachable at page load — paint the
                    // disconnected state immediately so the user knows.
                    // SSE will clear this when it (re)connects.
                    setBackendDisconnected();
                });
        }

        document.addEventListener('DOMContentLoaded', () => {
            setupSettingsModal();
            new WebRTCClient();
            new EventConfig();
            window.chatModal = new ChatModal();
            new TriggeredEvents();

            // Stage 6 item 1: seed the badges + disabled state before SSE fires.
            fetchInitialMonitoringStatus();

            // Stage 6 item 1 refinement: backstop staleness check. If the
            // SSE connection stays "open" but no heartbeats arrive (frozen
            // backend, network buffering), mark the UI disconnected after
            // ~2.5x the 15 s heartbeat interval.
            setInterval(() => {
                if (Date.now() - g_lastSseRxAt > SSE_STALE_AFTER_MS) {
                    setBackendDisconnected();
                }
            }, 5000);

            // Stage 4: Chat Now button kicks off a live-chat session.
            // Stash the ready-title so applyMonitoringStatus can restore it
            // when VLM transitions to ready (it was overridden to a loading
            // message in the HTML).
            const chatBtn = $('chatNowBtn');
            if (chatBtn) {
                chatBtn.dataset.titleReady = 'Open a live chat with the latest snapshot';
            }
            chatBtn.addEventListener('click', () => {
                if (window.chatModal) {
                    window.chatModal.openForLive();
                }
            });
        });
    </script>
</body>

</html>
